
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Payslip Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            padding: 40px;
        }
        .payslip {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }
        h1 {
            color: #2457a7;
            text-align: center;
        }
        .row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #2457a7;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="payslip">
        <h1>Monthly Payslip</h1>
        <p><strong>Employee:</strong> Demo Employee</p>
        <p><strong>Month:</strong> October 2026</p>

        <div class="row">
            <span>Basic Salary</span>
            <span>₹40,000</span>
        </div>
        <div class="row">
            <span>Allowances</span>
            <span>₹10,000</span>
        </div>
        <div class="row">
            <span>Deductions</span>
            <span>₹5,000</span>
        </div>
        <div class="row">
            <strong>Net Salary</strong>
            <strong>₹45,000</strong>
        </div>

        <button onclick="window.print()">Download Payslip</button>
    </div>
</body>
</html>
